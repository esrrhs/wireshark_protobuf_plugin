name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-linux:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake protobuf-compiler libprotobuf-dev libprotoc-dev wireshark-dev tshark python3

      - name: Build libecho & Run Tests (CTest)
        run: |
          cmake -S libecho -B libecho/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build libecho/build --config Release
          ctest --test-dir libecho/build --output-on-failure

      - name: Prepare Test PCAP & Configuration
        run: |
          mkdir -p run_test
          cp libecho/test/test.proto run_test/
          cp libecho/test/config.xml run_test/

          python3 - << 'EOF'
          import struct, socket

          def checksum(data):
              if len(data) % 2:
                  data += b"\x00"
              s = sum(struct.unpack("!%dH" % (len(data) // 2), data))
              while s >> 16:
                  s = (s & 0xffff) + (s >> 16)
              return ~s & 0xffff

          def make_ip_tcp(src_ip, dst_ip, src_port, dst_port, payload):
              total_len = 20 + 20 + len(payload)
              ip_src = socket.inet_aton(src_ip)
              ip_dst = socket.inet_aton(dst_ip)
              ip_hdr_no_cksum = struct.pack("!BBHHHBBH4s4s", 0x45, 0, total_len, 54321, 0x4000, 64, socket.IPPROTO_TCP, 0, ip_src, ip_dst)
              ip_hdr = struct.pack("!BBHHHBBH4s4s", 0x45, 0, total_len, 54321, 0x4000, 64, socket.IPPROTO_TCP, checksum(ip_hdr_no_cksum), ip_src, ip_dst)

              tcp_hdr_no_cksum = struct.pack("!HHIIHHHH", src_port, dst_port, 1000, 0, 0x5018, 8192, 0, 0)
              pseudo_hdr = struct.pack("!4s4sBBH", ip_src, ip_dst, 0, socket.IPPROTO_TCP, 20 + len(payload))
              tcp_hdr = struct.pack("!HHIIHHHH", src_port, dst_port, 1000, 0, 0x5018, 8192, checksum(pseudo_hdr + tcp_hdr_no_cksum + payload), 0)
              return ip_hdr + tcp_hdr + payload

          pb_body = bytes([
              0x0a, 0x05, 0x61, 0x6c, 0x69, 0x63, 0x65,
              0x12, 0x09, 0x73, 0x65, 0x63, 0x72, 0x65, 0x74, 0x31, 0x32, 0x33,
              0x18, 0x2a
          ])
          app_payload = struct.pack("!IH", 2 + len(pb_body), 1001) + pb_body
          ip_pkt = make_ip_tcp("192.168.1.10", "192.168.1.20", 50000, 12345, app_payload)

          gh = struct.pack("=IHHiIII", 0xa1b2c3d4, 2, 4, 0, 0, 65535, 1)
          eth = b"\x00\x11\x22\x33\x44\x55\x66\x77\x88\x99\xaa\xbb\x08\x00" + ip_pkt
          ph = struct.pack("=IIII", 1700000000, 0, len(eth), len(eth))

          with open("run_test/test.pcap", "wb") as f:
              f.write(gh + ph + eth)
          EOF

      - name: "E2E Test: C/C++ Binary Plugin"
        run: |
          set -euxo pipefail
          mkdir -p build_evil
          WS_CFLAGS=$(pkg-config --cflags wireshark)
          WS_VER=$(pkg-config --modversion wireshark | cut -d. -f1,2)
          WS_PLUGINDIR=$(pkg-config --variable=plugindir wireshark)
          echo "Wireshark $WS_VER"
          echo "CFLAGS: $WS_CFLAGS"
          echo "pkg-config plugindir: $WS_PLUGINDIR"

          # Compile plugin sources as C. Compiling plugin.c with g++ makes
          # WS_DLL_PUBLIC_DEF visibility attributes ignored and can give the
          # plugin_* globals internal linkage, so tshark cannot resolve them.
          # Link with g++ only to pull in the C++ static library libecho.
          # Do NOT link -lwireshark/-lwsutil into the plugin: leave Wireshark
          # API symbols undefined so they resolve against the already-loaded
          # libwireshark inside tshark (same recipe that worked on 4.2).
          # Do not -DPACKAGE/-DVERSION: wireshark config.h already defines them.
          COMMON_FLAGS="-fPIC -Wall -DPLUGIN_VERSION=\"1.0.0\" -DHAVE_PLUGINS=1 $WS_CFLAGS -Ievil -Ilibecho/libecho"
          gcc -c $COMMON_FLAGS evil/packet-evil.c -o build_evil/packet-evil.o
          gcc -c $COMMON_FLAGS evil/plugin.c -o build_evil/plugin.o
          g++ -shared -fPIC \
            -Wl,--no-as-needed \
            build_evil/packet-evil.o build_evil/plugin.o \
            libecho/build/libecho.a \
            -lprotobuf -lstdc++ \
            -o build_evil/evil.so

          echo "=== Exported plugin symbols ==="
          nm -D --defined-only build_evil/evil.so | grep -E 'plugin_(version|want_|register|describe)' || true
          echo "=== plugin_want_* values ==="
          # Print the int values stored for ABI version check
          python3 - << 'PY'
          import struct, sys
          from pathlib import Path
          data = Path("build_evil/evil.so").read_bytes()
          # fall back: use ctypes to dlopen and read symbols if possible
          try:
              import ctypes
              so = ctypes.CDLL("./build_evil/evil.so", mode=ctypes.RTLD_LOCAL)
              major = ctypes.c_int.in_dll(so, "plugin_want_major")
              minor = ctypes.c_int.in_dll(so, "plugin_want_minor")
              ver = ctypes.c_char_p.in_dll(so, "plugin_version")
              print(f"plugin_version={ver.value!r} want={major.value}.{minor.value}")
          except Exception as e:
              print(f"ctypes probe failed: {e}")
          PY
          echo "=== NEEDED / ldd ==="
          objdump -p build_evil/evil.so | awk '/NEEDED/{print}' || true
          ldd build_evil/evil.so || true

          echo "=== tshark folders ==="
          tshark -G folders | tee /tmp/ws-folders.txt
          PERS_PLUGINS=$(awk -F'\t' '/^Personal Plugins:/{print $2}' /tmp/ws-folders.txt)
          GLOB_PLUGINS=$(awk -F'\t' '/^Global Plugins:/{print $2}' /tmp/ws-folders.txt)
          echo "Personal Plugins dir: ${PERS_PLUGINS:-<empty>}"
          echo "Global Plugins dir: ${GLOB_PLUGINS:-<empty>}"

          # Install into every plausible epan dir so a path-skew cannot hide us.
          install_plugin() {
            local dest="$1"
            mkdir -p "$dest"
            cp -f build_evil/evil.so "$dest/"
            ls -la "$dest/evil.so"
          }
          if [[ -n "${PERS_PLUGINS:-}" ]]; then
            install_plugin "${PERS_PLUGINS}/epan"
          else
            install_plugin "$HOME/.local/lib/wireshark/plugins/$WS_VER/epan"
          fi
          if [[ -n "${GLOB_PLUGINS:-}" ]]; then
            sudo mkdir -p "${GLOB_PLUGINS}/epan"
            sudo cp -f build_evil/evil.so "${GLOB_PLUGINS}/epan/"
            sudo ls -la "${GLOB_PLUGINS}/epan/evil.so"
          elif [[ -n "${WS_PLUGINDIR:-}" ]]; then
            sudo mkdir -p "${WS_PLUGINDIR}/epan"
            sudo cp -f build_evil/evil.so "${WS_PLUGINDIR}/epan/"
          fi

          # Also expose via WIRESHARK_PLUGIN_DIR (overrides global plugin root).
          # Layout must be $WIRESHARK_PLUGIN_DIR/<PLUGIN_PATH_ID>/epan/*.so
          export WIRESHARK_PLUGIN_DIR="$PWD/build_evil/ws_plugins"
          mkdir -p "$WIRESHARK_PLUGIN_DIR/$WS_VER/epan"
          cp -f build_evil/evil.so "$WIRESHARK_PLUGIN_DIR/$WS_VER/epan/"

          echo "=== tshark -G plugins (WIRESHARK_LOG_LEVEL=noisy) ==="
          # Capture both streams; load failures go through report_failure -> stderr
          set +e
          WIRESHARK_LOG_LEVEL=noisy tshark -G plugins > /tmp/ws-plugins.txt 2>/tmp/ws-plugins.err
          ts_rc=$?
          set -e
          echo "tshark exit=$ts_rc"
          if [[ -s /tmp/ws-plugins.err ]]; then
            echo "tshark stderr:" >&2
            cat /tmp/ws-plugins.err >&2
          fi
          cat /tmp/ws-plugins.txt
          grep -F evil.so /tmp/ws-plugins.txt

          cd run_test
          output=$(tshark -r test.pcap -Y 'myname.packetname == "testpkg.LoginRequest"' -T fields -e myname.packetid -e myname.packetname)
          echo "C++ Plugin Output: $output"
          echo "$output" | grep -F "testpkg.LoginRequest"

          # Cleanup
          rm -f "$WIRESHARK_PLUGIN_DIR/$WS_VER/epan/evil.so"
          if [[ -n "${PERS_PLUGINS:-}" ]]; then
            rm -f "${PERS_PLUGINS}/epan/evil.so"
          fi
          if [[ -n "${GLOB_PLUGINS:-}" ]]; then
            sudo rm -f "${GLOB_PLUGINS}/epan/evil.so"
          elif [[ -n "${WS_PLUGINDIR:-}" ]]; then
            sudo rm -f "${WS_PLUGINDIR}/epan/evil.so"
          fi

      - name: "E2E Test: Lua Script Plugin"
        run: |
          cd run_test
          # Run tshark loading Lua plugin directly with -X lua_script:
          output=$(tshark -X lua_script:../lua/packet-evil.lua -r test.pcap -Y 'myname.packetname == "testpkg.LoginRequest"' -T fields -e myname.packetid -e myname.packetname)
          echo "Lua Plugin Output: $output"
          echo "$output" | grep "testpkg.LoginRequest"
          echo "All E2E Tests (C++ and Lua) PASSED!"

  test-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Protobuf via vcpkg
        run: |
          vcpkg install protobuf:x64-windows

      - name: Build libecho & Run Tests
        run: |
          cmake -S libecho -B libecho/build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=ON
          cmake --build libecho/build --config Release
          Copy-Item libecho/test/config.xml libecho/build/ -Force
          Copy-Item libecho/test/test.proto libecho/build/ -Force
          if (Test-Path libecho/build/Release) {
            Copy-Item libecho/test/config.xml libecho/build/Release/ -Force
            Copy-Item libecho/test/test.proto libecho/build/Release/ -Force
          }
          ctest --test-dir libecho/build -C Release --output-on-failure
